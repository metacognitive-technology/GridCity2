services:
  gridcity:
    build:
      context: .
      dockerfile: Dockerfile
    image: gridcity:local
    container_name: gridcity
    ports:
      # IMPORTANT: WebSocket (Socket.io) connections are most reliable when accessing
      # directly via this mapped port (http://your-host:3001).
      # The Traefik HTTPS domain can have upgrade issues depending on your Traefik setup.
      - "3001:3000"
    volumes:
      - gridcity_data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - XAI_API_KEY=${XAI_API_KEY:-}
      - GRIDBOT_ESCALATE_WEBHOOK_URL=${GRIDBOT_ESCALATE_WEBHOOK_URL:-}
      - GRIDBOT_ESCALATE_WEBHOOK_AUTH=${GRIDBOT_ESCALATE_WEBHOOK_AUTH:-}
      - GRIDCITY_ADMIN_EMAIL=${GRIDCITY_ADMIN_EMAIL:-}
      - GRIDCITY_ADMIN_NAME=${GRIDCITY_ADMIN_NAME:-}
      - GRIDCITY_ADMIN_INITIAL_PASSWORD=${GRIDCITY_ADMIN_INITIAL_PASSWORD:-}
      - GRIDCITY_ADMIN_PASSWORD=${GRIDCITY_ADMIN_PASSWORD:-}
      - GRIDCITY_ADMIN_FORCE_CHANGE=${GRIDCITY_ADMIN_FORCE_CHANGE:-}
      - GRIDCITY_ORIGINS=${GRIDCITY_ORIGINS:-}
      - GRIDCITY_TZ=${GRIDCITY_TZ:-}
      - GRIDBOT_ESCALATE_INJECT_TOKEN=${GRIDBOT_ESCALATE_INJECT_TOKEN:-}
      - GRIDBOT_INJECT_TOKEN=${GRIDBOT_INJECT_TOKEN:-}
      - GRIDBOT_FAKE_LLM=${GRIDBOT_FAKE_LLM:-}
      - QUICK_TASK_DEFAULT_ASSIGNEE=${QUICK_TASK_DEFAULT_ASSIGNEE:-}
      - QUICK_TASK_PLAYER_TOAST=${QUICK_TASK_PLAYER_TOAST:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      # Main HTTPS router
      - "traefik.http.routers.grid.rule=Host(`grid.metacognitive-bot.tech`)"
      - "traefik.http.routers.grid.entrypoints=websecure"
      - "traefik.http.routers.grid.tls.certresolver=letsencrypt"
      - "traefik.http.routers.grid.priority=10"
      - "traefik.http.services.grid.loadbalancer.server.port=3000"

      # WebSocket-specific router (helps with upgrade headers)
      - "traefik.http.routers.grid-ws.rule=Host(`grid.metacognitive-bot.tech`) && PathPrefix(`/socket.io/`)"
      - "traefik.http.routers.grid-ws.entrypoints=websecure"
      - "traefik.http.routers.grid-ws.tls.certresolver=letsencrypt"
      - "traefik.http.routers.grid-ws.service=grid"
      - "traefik.http.routers.grid-ws.priority=20"

volumes:
  gridcity_data:
    driver: local
